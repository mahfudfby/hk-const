<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/marketing/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ── SEO dasar ── -->
    <title>HIKIMORI CONST — Desain, Bangun & Renovasi Rumah Premium</title>
    <meta name="description" content="Hikimori Const — jasa desain & bangun rumah premium: Interior, Eksterior, Landscape, dan Tema Rumah custom sesuai impian Anda. Konsultasi gratis." />
    <meta name="theme-color" content="#2E3D3F" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="__SITE_URL__/" />
    <meta name="google-site-verification" content="__VERIFY_GOOGLE__" />
    <meta name="facebook-domain-verification" content="__VERIFY_META__" />

    <!-- ── Open Graph (WhatsApp, Facebook, Instagram, LinkedIn, dll) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HIKIMORI CONST" />
    <meta property="og:title" content="HIKIMORI CONST — Desain, Bangun & Renovasi Rumah Premium" />
    <meta property="og:description" content="Jasa desain & bangun rumah premium: Interior, Eksterior, Landscape, dan Tema Rumah custom. Konsultasi gratis." />
    <meta property="og:image" content="__SITE_URL__/marketing/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="__SITE_URL__" />
    <meta property="og:locale" content="id_ID" />

    <!-- ── Twitter / X Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HIKIMORI CONST — Desain, Bangun & Renovasi Rumah Premium" />
    <meta name="twitter:description" content="Jasa desain & bangun rumah premium: Interior, Eksterior, Landscape, dan Tema Rumah custom. Konsultasi gratis." />
    <meta name="twitter:image" content="__SITE_URL__/marketing/og-image.png" />

    <!-- ── Performa: sambungkan lebih awal ke host yang pasti dipakai ── -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Font self-hosted (src/styles/fonts.css). Dua font utama di-preload; tautan di bawah
         disisipkan otomatis saat build oleh plugin "hikimori-seo" karena nama file ber-hash. -->
    <!--PRELOAD_FONTS-->

    <style>
      html,body{margin:0;background:#2E3D3F}
      .hc-boot{position:fixed;inset:0;display:grid;place-items:center;background:#2E3D3F;z-index:1}
      .hc-boot img{width:min(260px,60vw);height:auto;animation:b 1.6s ease-in-out infinite alternate}
      @keyframes b{from{opacity:.55}to{opacity:1}}
    </style>
  </head>
  <body>
    <!-- Splash instan: tampil seketika sebelum JavaScript selesai diunduh (penting di koneksi lambat); otomatis diganti React -->
    <div id="root"><div class="hc-boot" aria-hidden="true"><img src="/images/hikimori-const-logo-light.svg" alt="" width="260" height="97" /></div></div>
    <noscript><p style="color:#fff;font-family:sans-serif;padding:2rem;text-align:center">Aktifkan JavaScript untuk melihat website Hikimori Const.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
